# GitHub-native, ten-minute mechanical PR gate; no external AI or provider credentials.
name: PR #1 readiness watchdog
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
concurrency:
  group: adaptative-harness-pr1-watch
  cancel-in-progress: false
jobs:
  assess:
    if: github.repository == 'MasterSkimo/adaptative-harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check PR #1 readiness and merge only if gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/watch-pr1.mjs
