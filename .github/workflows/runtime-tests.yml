name: Runtime contract tests
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'migrations/**'
      - 'tests/*.test.ts'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/runtime-tests.yml'
  push:
    branches: [main]
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: TypeScript and SQLite runtime tests
        run: node --experimental-strip-types --test tests/*.test.ts
