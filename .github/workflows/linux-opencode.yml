name: Linux OpenCode integration
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Linux OpenCode test image
        run: docker build --file tests/linux-opencode/Dockerfile --tag adaptive-harness-linux-test:2.2.5 .
      - name: Exercise native plugin and daemon
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network none adaptive-harness-linux-test:2.2.5 2>&1 | tee linux-opencode-test.log
      - name: Retain sanitized test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-opencode-test-log
          path: linux-opencode-test.log
          if-no-files-found: ignore
