# Contract/schema validation only; this workflow is not an agent integration test.
name: Specification validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spec test dependencies
        run: python -m pip install "jsonschema>=4.22,<5" "PyYAML>=6,<7"
      - name: Run schema and SQL tests
        run: python -m unittest discover -s tests -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spec test dependencies
        run: python -m pip install "jsonschema>=4.22,<5" "PyYAML>=6,<7"
      - name: Run schema and SQL tests
        run: python -m unittest discover -s tests -v

